name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Hugging Face README Header & Deploy Clean Tree
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cat << 'EOF' > hf_header.txt
          ---
          title: Universal Document Parser
          emoji: 📄
          colorFrom: blue
          colorTo: indigo
          sdk: gradio
          sdk_version: 5.20.0
          app_file: main.py
          pinned: false
          license: mit
          short_description: Zero-GPU CPU document ingestion engine for RAG pipelines.
          ---

          EOF
          cat hf_header.txt README.md > README_HF.md
          mv README_HF.md README.md
          rm hf_header.txt

          # Configure git
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Remove binary files and test fixtures for HF deployment
          rm -rf assets/ tests/fixtures/ .git/

          # Initialize a fresh single-commit git repository to strip any historical binary blobs
          git init -b main
          git add README.md main.py pyproject.toml requirements.txt universal_parser/ benchmarks/ LICENSE
          git commit -m "deploy: live Hugging Face Space application"
          git push -f https://Karan6124:$HF_TOKEN@huggingface.co/spaces/Karan6124/universal-doc-parser main
