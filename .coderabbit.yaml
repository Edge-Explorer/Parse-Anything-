# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "You are a senior Python systems engineer reviewing code for an open-source document parsing library. Be concise, rigorous, and technical. Focus strictly on code correctness, edge cases, exception handling, memory efficiency (<250MB RSS), and type safety. Do not use emojis anywhere."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/*.md"
    - "!docs/**"
    - "!assets/**"
    - "!tests/fixtures/**"
    - "!LICENSE"
  tools:
    ruff:
      enabled: true

chat:
  auto_reply: true