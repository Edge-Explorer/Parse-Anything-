[project]
name = "universal-parser"
version = "0.1.0"
description = "A zero-GPU, fully open-source document ingestion engine for RAG pipelines."
readme = "README.md"
requires-python = ">=3.11"
license= { text= "MIT"}
dependencies = [
    "pydantic>=2.0",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "numpy>=2.4.6",
    "docx>=0.2.4",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "pyarrow>=25.0.1",
    "selectolax>=0.4.11",
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "rapidocr-onnxruntime>=1.4.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "extract-msg>=0.56.1",
    "python-pptx>=1.0.2",
    "xlrd>=2.0.2",
    "olefile>=0.47",
    "xlwt>=1.3.0",
]

[project.optional-dependencies]
dev=[
    "pytest>=8.0",
    "pytest-cov",
    "hypothesis",
]
ocr=[
    "rapidocr-onnxruntime>=1.3",
    "opencv-python-headless>=4.9",
]
enrichment=[
    "onnxruntime>=1.18",
]
[build-system]
requires= ["hatchling"]
build-backend= "hatchling.build"

[tool.hatch.build.targets.wheel]
packages=["universal_parser"]
